services:

  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    container_name: cafecash-pb
    restart: unless-stopped
    ports:
      - "8091:8090"        # host:container (8090 taken by Mythic)
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        # Baked into the Next.js client bundle — Tailscale IP for browser calls
        NEXT_PUBLIC_API_URL: http://100.85.162.13:8091
    container_name: cafecash-admin
    restart: unless-stopped
    ports:
      - "3001:3000"        # host:container (3000 taken by Mythic)
    environment:
      NEXT_PUBLIC_API_URL: http://100.85.162.13:8091
      # Server-side Next.js calls use Docker-internal network
      PB_SERVER_URL: http://pocketbase:8090
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:
    driver: local
    # Seed from existing pb_data if present
    driver_opts:
      type: none
      o: bind
      device: ./pb_data
